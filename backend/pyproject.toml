[project]
name = "universaleye-backend"
version = "0.1.0"
description = "Python backend for Universal Eye label inspection system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "opencv-python-headless>=4.10.0,<5.0",
    "scikit-image>=0.24.0,<1.0",
    "numpy>=2.0.0,<3.0",
    "sse-starlette>=2.0.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
